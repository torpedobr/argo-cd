apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: helm-charts-appset
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: git@github.ibm.com:dmkonovalov/argotest.git
        revision: main
        directories:
          - path: "*" # Adjust this to match your Helm chart paths in the repo
  template:
    metadata:
      name: '{{path.basename}}' # Name the application after the Helm chart directory
    spec:
      project: default # Replace with your ArgoCD project if necessary
      source:
        repoURL: git@github.ibm.com:dmkonovalov/argotest.git
        targetRevision: main
        path: '{{path}}'
        helm:
          releaseName: '{{path.basename}}' # Use the directory name as the release name
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}' # Optional: Create a namespace per Helm chart
      syncPolicy:
        automated:
          prune: true
          selfHeal: true